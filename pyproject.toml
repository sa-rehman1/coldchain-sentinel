[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "coldchain-sentinel"
version = "0.1.0"
description = "Governed operations platform for temperature-sensitive shipments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiokafka>=0.12,<0.13",
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "jsonschema>=4.23,<5",
  "mypy>=1.14,<2",
  "pre-commit>=4.0,<5",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6.0,<7",
  "ruff>=0.9,<1",
  "types-jsonschema>=4.23,<5",
]

[project.optional-dependencies]
semantic-embeddings = ["fastembed>=0.7,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/coldchain"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"alembic/versions/**" = ["E501"]
"scripts/check_tracked_env.py" = ["S603"]
"scripts/check_tracked_secrets.py" = ["S603"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/coldchain", "tests"]
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["aiokafka.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=coldchain --cov-report=term-missing --cov-report=xml --cov-fail-under=85"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires an explicitly configured external service",
  "e2e: requires an explicitly configured running Docker stack",
  "live_groq: explicit one-call Groq smoke test",
]

[tool.coverage.run]
branch = true
source = ["coldchain"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  '\.\.\.',
]
