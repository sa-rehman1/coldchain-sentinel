global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: coldchain-api
    metrics_path: /metrics
    static_configs:
      - targets: [api:8000]
  - job_name: coldchain-worker
    static_configs:
      - targets: [worker:9100]
